name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6.4
      - name: Build (testa o nucleo e gera o jar)
        run: |
          set -o pipefail
          gradle coreTest build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Upload do jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eternalrealms-jar
          path: build/libs/*.jar
      - name: Publicar log e jar na branch ci-logs
        if: always()
        run: |
          mkdir -p /tmp/pub
          cp build.log /tmp/pub/ 2>/dev/null || true
          cp build/libs/*.jar /tmp/pub/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan ci-logs
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/pub/* . 2>/dev/null || true
          git add -A
          git commit -m "ci: resultado do build ${GITHUB_SHA}" || true
          git push -f origin ci-logs
