buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '0.1.0'
group = 'com.eternalrealms'
archivesBaseName = 'eternalrealms-1.16.5'

// Minecraft 1.16.5 exige Java 8
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    // Mapeamentos MCP para 1.16.5 (nomes usados em todo o código-fonte)
    mappings channel: 'snapshot', version: '20210309-1.16.5'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { eternalrealms { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { eternalrealms { source sourceSets.main } }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.39'
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "eternalrealms",
            "Specification-Vendor"    : "Eternal Realms",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : "${version}",
            "Implementation-Vendor"   : "Eternal Realms",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

// Autoteste do núcleo (Java puro, sem Minecraft): ./gradlew coreTest
task coreTest(type: JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.main.output + sourceSets.test.output
    mainClass = 'com.eternalrealms.rpg.core.CoreSelfTest'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
